<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakabam-Player</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            user-select: none; 
            -webkit-user-select: none;
        }

        .instrument {
            position: relative;
            width: 100%;
            max-width: 950px;
            filter: drop-shadow(0 20px 30px rgba(142, 184, 229, 0.4)); 
            margin-bottom: 40px;
        }

        .instrument svg {
            width: 100%;
            height: auto;
            display: block;
        }

        #pad {
            position: absolute;
            left: 6.84%;     
            top: 33%;        
            width: 70.52%;   
            height: 52%;     
            
            border-radius: 12px; 
            background: linear-gradient(to bottom, #ffffff 0%, #e2e8f0 100%);
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.1), 0 4px 6px rgba(0,0,0,0.05);
            cursor: crosshair;
            touch-action: none;
            border: 3px solid #94a3b8; 
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="instrument">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 400">
            <defs>
                <clipPath id="bodyClip">
                    <path d="M 50 130 A 80 80 0 0 1 130 50 L 670 50 A 80 80 0 0 1 750 130 L 750 338 A 12 12 0 0 1 738 350 L 62 350 A 12 12 0 0 1 50 338 Z"></path>
                </clipPath>
            </defs>
            <path d="M 720 150 L 830 70 L 830 240 L 720 150 Z" fill="#1d78ff" stroke="#1e293b" stroke-width="6" stroke-linejoin="round"></path>
            <path d="M 50 130 A 80 80 0 0 1 130 50 L 670 50 A 80 80 0 0 1 750 130 L 750 338 A 12 12 0 0 1 738 350 L 62 350 A 12 12 0 0 1 50 338 Z" fill="#1d78ff" stroke="#1e293b" stroke-width="6"></path>
            <rect x="50" y="125" width="700" height="250" fill="#FFFFFF" clip-path="url(#bodyClip)"></rect>
            <path d="M 50 130 A 80 80 0 0 1 130 50 L 670 50 A 80 80 0 0 1 750 130 L 750 338 A 12 12 0 0 1 738 350 L 62 350 A 12 12 0 0 1 50 338 Z" fill="none" stroke="#1e293b" stroke-width="6"></path>
            <path d="M 60 85 A 105 75 0 0 1 255 85" fill="none" stroke="#0f172a" stroke-width="40" stroke-dasharray="0 10" stroke-linecap="round" pathLength="100"></path>
            <path d="M 60 85 A 105 75 0 0 1 255 85" fill="none" stroke="#ffffff" stroke-width="25" stroke-dasharray="0 5" stroke-linecap="round" pathLength="100"></path>
            <path d="M 55 80 A 110 80 0 0 1 260 80" fill="none" stroke="#1d78ff" stroke-width="5" stroke-dasharray="10 6" stroke-linecap="round"></path>
            <circle cx="120" cy="100" r="22" fill="#FFFFFF" stroke="#1e293b" stroke-width="5"></circle>
            <circle cx="120" cy="100" r="10" fill="#1e293b"></circle>
            <circle cx="200" cy="100" r="22" fill="#FFFFFF" stroke="#1e293b" stroke-width="5"></circle>
            <circle cx="200" cy="100" r="10" fill="#1e293b"></circle>
            <polygon points="145,110 175,110 160,130" fill="#fca5a5" stroke="#1e293b" stroke-width="4" stroke-linejoin="round"></polygon>
        </svg>

        <canvas id="pad" width="1280" height="360"></canvas>
    </div>

<script>
    const BASE_NOTE = 83; // audacity 측정치, loop기준 Fundamental Frequency : 993Hz(-11dB)
    const PITCH_RANGE = 12; 

    let audioCtx = null;
    let initBuffer = null, loopBuffer = null, finishBuffer = null;
    let initSource = null, loopSource = null;
    let playGainNode = null;
    let isPressed = false;
    let currentPitchRatio = 1.0;

    const padCanvas = document.getElementById('pad');
    const ctx = padCanvas.getContext('2d');
    const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

    function initAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    async function fetchAssets() {
        initAudioContext();
        try {
            const [initRes, loopRes, finishRes] = await Promise.all([
                fetch('./assets/init.wav').catch(() => null),
                fetch('./assets/loop.wav').catch(() => null),
                fetch('./assets/finish.wav').catch(() => null)
            ]);

            if (initRes && initRes.ok) initBuffer = await audioCtx.decodeAudioData(await initRes.arrayBuffer());
            if (loopRes && loopRes.ok) loopBuffer = await audioCtx.decodeAudioData(await loopRes.arrayBuffer());
            if (finishRes && finishRes.ok) finishBuffer = await audioCtx.decodeAudioData(await finishRes.arrayBuffer());
        } catch (error) {
            console.error("음원 파일 로드 실패:", error);
        }
    }

    function drawPad() {
        const width = padCanvas.width;
        const height = padCanvas.height;
        const minNote = BASE_NOTE - PITCH_RANGE;
        const maxNote = BASE_NOTE + PITCH_RANGE;
        const totalNotes = maxNote - minNote;

        ctx.clearRect(0, 0, width, height);

        for (let i = Math.ceil(minNote); i <= Math.floor(maxNote); i++) {
            const normalizedX = (i - minNote) / totalNotes;
            const xPos = normalizedX * width;
            const nameIndex = ((i % 12) + 12) % 12;
            const isBlackKey = noteNames[nameIndex].includes("#");

            ctx.beginPath();
            ctx.moveTo(xPos, 0);
            ctx.lineTo(xPos, height);
            ctx.lineWidth = isBlackKey ? 3 : 5;
            ctx.strokeStyle = isBlackKey ? 'rgba(148, 163, 184, 0.4)' : 'rgba(100, 116, 139, 0.8)';
            ctx.stroke();

            ctx.fillStyle = '#1e293b';
            ctx.font = isBlackKey ? 'bold 24px Arial' : 'bold 32px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            
            if (i === BASE_NOTE) ctx.fillStyle = '#1d78ff'; 
            
            ctx.fillText(noteNames[nameIndex], xPos, height - 35);
        }
    }

    function getNoteFromX(clientX) {
        const rect = padCanvas.getBoundingClientRect();
        const normalizedX = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        return (BASE_NOTE - PITCH_RANGE) + (PITCH_RANGE * 2) * normalizedX;
    }

    function playNote(midiNote) {
        if (!audioCtx) return;
        currentPitchRatio = Math.pow(2, (midiNote - BASE_NOTE) / 12);

        if (!isPressed) {
            isPressed = true;
            const now = audioCtx.currentTime;
            let loopStartTime = now;

            playGainNode = audioCtx.createGain();
            playGainNode.gain.setValueAtTime(0, now);
            playGainNode.gain.linearRampToValueAtTime(1, now + 0.02); 
            playGainNode.connect(audioCtx.destination);

            if (initBuffer) {
                initSource = audioCtx.createBufferSource();
                initSource.buffer = initBuffer;
                initSource.playbackRate.value = currentPitchRatio;
                initSource.connect(playGainNode);
                initSource.start(now);
                loopStartTime = now + (initBuffer.duration / currentPitchRatio);
            }

            if (loopBuffer) {
                loopSource = audioCtx.createBufferSource();
                loopSource.buffer = loopBuffer;
                loopSource.loop = true;
                loopSource.playbackRate.value = currentPitchRatio;
                loopSource.connect(playGainNode);
                loopSource.start(loopStartTime);
            }
        } else {
            if (initSource) initSource.playbackRate.setTargetAtTime(currentPitchRatio, audioCtx.currentTime, 0.01);
            if (loopSource) loopSource.playbackRate.setTargetAtTime(currentPitchRatio, audioCtx.currentTime, 0.01);
        }
    }

    function stopNote() {
        if (isPressed) {
            const now = audioCtx.currentTime;
            
            if (playGainNode) {
                playGainNode.gain.cancelScheduledValues(now);
                playGainNode.gain.setValueAtTime(playGainNode.gain.value, now);
                playGainNode.gain.linearRampToValueAtTime(0, now + 0.03);
                
                if (initSource) { try { initSource.stop(now + 0.04); } catch(e){} }
                if (loopSource) { try { loopSource.stop(now + 0.04); } catch(e){} }
            }

            if (finishBuffer) {
                const finishSource = audioCtx.createBufferSource();
                finishSource.buffer = finishBuffer;
                finishSource.playbackRate.value = currentPitchRatio;
                
                const finishGain = audioCtx.createGain();
                finishGain.gain.setValueAtTime(1, now);
                finishSource.connect(finishGain);
                finishGain.connect(audioCtx.destination);
                
                finishSource.start(now);
                finishGain.gain.setTargetAtTime(0, now + finishBuffer.duration - 0.1, 0.05); 
            }
        }
        isPressed = false;
        initSource = null;
        loopSource = null;
    }

    padCanvas.addEventListener('mousedown', (e) => {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        playNote(getNoteFromX(e.clientX));
    });
    window.addEventListener('mousemove', (e) => {
        if (isPressed) playNote(getNoteFromX(e.clientX));
    });
    window.addEventListener('mouseup', stopNote);

    padCanvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        playNote(getNoteFromX(e.touches[0].clientX));
    }, { passive: false });
    window.addEventListener('touchmove', (e) => {
        if (isPressed) playNote(getNoteFromX(e.touches[0].clientX));
    }, { passive: false });
    window.addEventListener('touchend', stopNote);
    window.addEventListener('touchcancel', stopNote);

    window.addEventListener('DOMContentLoaded', () => {
        drawPad();
        fetchAssets();
    });
</script>

</body>
</html>
